<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startup Story</title>
<meta name="description" content="Learn growth strategy from the companies you already know — search any public company and explore its real numbers, story, and competitive position." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css?v=16" />
</head>
<body>

<div id="drawerScrim" class="drawer-scrim hidden"></div>

<aside id="sidebar" class="sidebar">
  <div id="sidebarBody" class="sidebar-body"></div>
</aside>

<main id="panel" class="panel">
  <button id="drawerToggle" class="drawer-toggle" aria-label="Menu">&#9776;</button>
  <button id="settingsBtn" class="icon-btn" title="API keys">&#9881;</button>
  <div id="panelBody" class="panel-body"></div>
</main>

<p id="statusToast" class="status-toast hidden"></p>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h2>API Keys (optional)</h2>
    <p class="modal-sub">Search works out of the box on a shared demo backend with limited daily quota. Add your own free keys here to skip the shared limits entirely — stored only in your browser, never sent anywhere except directly to these providers.</p>

    <label>Alpha Vantage API key <a href="https://www.alphavantage.co/support/#api-key" target="_blank" rel="noopener">(get a free one)</a></label>
    <input id="avKeyInput" type="text" placeholder="Alpha Vantage key" />

    <label>Anthropic API key <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">(get one)</a></label>
    <input id="claudeKeyInput" type="text" placeholder="sk-ant-..." />

    <div class="modal-actions">
      <button id="saveKeysBtn" class="primary-btn">Save</button>
      <button id="closeModalBtn" class="ghost-btn">Close</button>
    </div>
  </div>
</div>

<script src="js/config.js?v=16"></script>
<script src="js/tickerAliases.js?v=16"></script>
<script src="js/financeApi.js?v=16"></script>
<script src="js/claudeApi.js?v=16"></script>
<script src="js/treeBuilder.js?v=16"></script>
<script src="js/explorer.js?v=16"></script>
<script src="js/main.js?v=16"></script>
</body>
</html>
